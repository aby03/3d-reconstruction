# Every config key with its default. Later layers (--config FILE, then --set a.b=c) override these.

run:
  output_root: outputs
  seed: 0

device:
  preference: auto               # auto (CUDA where available, else CPU) | cuda (error if unavailable) | cpu
  gpu_index: 0

loader:
  allow_mismatch: false          # truncate video frames and timestamps to the shorter instead of failing
  verify_reference_jpegs: true   # compare decoded frames with the saved JPEGs on load
  max_reference_checks: null     # null checks every reference JPEG
  decode_backend: auto           # auto | nvdec | pyav; auto uses NVDEC where available (follows device.preference)

ingest:
  camera_time_offset_ns: 0       # added to frame timestamps to get the sensor-clock query time
  max_gap_ms: {accel: 20.0, gyro: 20.0, magnetic: 50.0}
  required: [accel, gyro]
  gravity_method: complementary  # complementary | lowpass
  gravity_bidirectional: true

keyframes:
  method: adaptive               # adaptive (overlap/rotation triggers) | uniform (one per 1/uniform_fps s, baseline)
  uniform_fps: 3.0
  analysis_long_side: 960        # quality metrics on frames scaled to this long side
  metrics_backend: auto          # auto | torch | numpy; auto uses torch on CUDA where available (follows device.preference)
  metrics_batch: 32              # frames per GPU batch
  reject:                        # hard rejects; a rejected frame is only chosen when its whole window is rejected
    sharp_rel_min: 0.55          # sharpness / its 2 s rolling median
    clipped_max: 0.25            # fraction of pixels < 5 or > 250
    feat_coverage_min: 0.15      # fraction of 8x8 grid cells with >= 5 FAST corners
    omega_max: 1.5               # rad/s
  weights:                       # q = sharp*z(log sharp_rel) + features*feat_coverage - omega*omega_norm - clipped*max(0, clipped - 0.05)
    sharp: 1.0
    features: 0.5
    omega: 0.7
    clipped: 1.0
  min_per_s: 2.5                 # adaptive: trigger thresholds are scaled until the keyframe count is
  max_per_s: 7.0                 #   within [min_per_s, max_per_s] x duration
  trigger:                       # adaptive: a new keyframe is due when any of these is reached since the last one
    flow_frac: 0.04              # median KLT displacement, in image diagonals
    track_ratio: 0.70            # fraction of the keyframe's corners still tracked (at or below)
    rot_deg: 8.0                 # gyro rotation
  window_s: 0.25                 # candidates from [t_trigger - window_s, t_trigger + window_s / 2]
  min_track_ratio: 0.50          # a candidate still tracks this fraction of the keyframe's corners
  min_flow_frac: 0.01            # and has moved at least this much (no near-duplicates)
  max_gap_s: 1.0                 # longer without a trigger forces a keyframe
  jpeg_quality: 95
  prior_window: 3                # relative-rotation priors between keyframes up to this many apart

sfm:
  initial_camera_model: SIMPLE_RADIAL  # COLMAP model the mapper estimates; one camera per sequence image folder
  features:
    type: sift
    max_num_features: 8192
    max_image_size: 1920         # long side the images are scaled to for extraction
    domain_size_pooling: false   # true is better on low texture but forces COLMAP's CPU SIFT
  matching:
    strategy: auto               # auto (exhaustive up to exhaustive_max_images, else sequential) | sequential | exhaustive
    exhaustive_max_images: 200
    overlap: 20                  # sequential: each keyframe is matched with the next `overlap` ones
    quadratic_overlap: true      # sequential: and with the ones 2^k further on
    min_num_inliers: 15          # a pair is verified with at least this many inlier matches
    max_num_matches: 32768
    loop_detection: true         # sequential: match every loop_detection_period-th keyframe with its
    loop_detection_period: 10    #   loop_detection_num_images most similar ones (vocab tree), to close revisits
    loop_detection_num_images: 50
    vocab_tree_path: null        # null: COLMAP's SIFT tree, downloaded once into ~/.cache/colmap/ (off if that fails)
  priors:
    use_gravity_prior: true      # keyframe gravity (priors/gravity_cam.csv) constrains rotation averaging
    gravity_min_conf: 0.3        # priors below this confidence are left out
    imu_pair_filter:             # drop verified pairs whose relative rotation disagrees with the IMU
      enabled: true
      max_rot_err_deg: 10.0      # pairs up to max_dt_s apart: angle between image and gyro rotation
      max_dt_s: 5.0
      tilt_err_deg: 5.0          # other pairs: angle between the rotated gravity of one image and the other's
      max_removed_frac: 0.3      # more disagreeing pairs than this: the IMU is suspect, remove nothing (warning)
  mapper:
    backend: global              # global (COLMAP's GLOMAP) | incremental
    fallback: true               # when fewer than min_registered_ratio of the keyframes register or the mapper
    min_registered_ratio: 0.8    #   fails: retry global without gravity, then incremental; the best result is kept
  refine:                        # sparse/refined: retriangulate, upgrade the camera, BA, filter, BA
    enabled: true                # false: sparse/refined is a copy of sparse/raw
    final_camera_model: OPENCV
    refine_principal_point: false
    max_reproj_px: 2.0           # observations with a larger reprojection error are removed
    min_track_len: 3             # points seen in fewer keyframes are removed
    min_tri_angle_deg: 1.5       # points with a smaller triangulation angle are removed
    min_image_obs: 15            # images observing fewer points are deregistered first (their pose is unconstrained)

align:                           # world frame W: Z up, gravity -Z, floor z = 0, origin under the median camera
  gravity:
    method: auto                 # auto (imu when enough priors, else camera_up) | imu | camera_up (image-down + floor)
    huber_deg: 3.0               # IRLS Huber threshold on the angle to the mean down direction
    min_conf: 0.3                # gravity priors below this confidence are left out
    min_prior_frac: 0.2          # auto: imu needs priors on at least this fraction of the registered images
    max_residual_deg: 5.0        # warn above this median residual (R_cam_imu, time offset or model suspect)
  floor:
    enabled: true
    min_inlier_frac: 0.05        # the floor peak holds at least this fraction of the points
    max_normal_deg: 10.0         # floor plane normal within this of up
    cameras_above_frac: 0.9      # the floor lies below at least this fraction of the cameras
    max_tilt_correction_deg: 2.0 # rotate the floor normal onto up when it is within this of gravity
    fallback_max_deg: 15.0       # camera_up: the floor normal may be this far from the image-down estimate
    bin_frac: 0.01               # histogram bin, as a fraction of the scene extent (units are arbitrary)
    ransac_iterations: 1000
    max_reproj_px: 1.5           # floor candidates: points with a smaller error
    min_track_len: 3             #   and a longer track
  manhattan:                     # yaw about Z so that X/Y follow the dominant walls
    enabled: true
    min_confidence: 0.25         # mass of the peak bin +- peak_halfwidth_deg bins; below: yaw not applied
    knn: 30                      # neighbours for the point normals
    min_planarity: 5.0           # second / smallest eigenvalue of the neighbourhood
    max_normal_z: 0.2            # wall-like normals are this close to horizontal
    peak_halfwidth_deg: 2        # in 1° bins (the confidence window is 5° wide)
    extent_tie: 1.1              # 90° ambiguity: X along the longer side, unless the sides are this close
  cam_imu:                       # hand-eye R_cam_imu and camera time offset from SfM vs gyro; report only
    enabled: true
    pair_span: 5                 # keyframe pairs up to this many apart
    min_rotation_deg: 2.0        # hand-eye uses pairs that rotate at least this much
    max_offset_ms: 100.0         # time offsets searched in +-this, 1 ms steps

dense:                           # step 5: undistort the aligned model, OpenMVS densify + mesh (CUDA per device.preference)
  undistort:
    max_image_size: -1           # -1: full resolution (1080x1920 keyframes -> 1043x1857 PINHOLE)
  openmvs:
    resolution_level: 1          # images scaled down by 2^level before patch match ...
    min_resolution: 640          #   ... but the long side never below this (level 2 = level 1 on 1857 px images)
    max_resolution: 2560
    number_views: 6              # neighbour views per depth map (tiny: 6 -> 70 s, 8 + iters 4 -> 101 s)
    number_views_fuse: 3         # a fused point needs this many agreeing depth maps
    sub_resolution_levels: 2
    iters: 3                     # patch-match iterations
    geometric_iters: 2           # geometric-consistency iterations (1: -19% time, -5% points on tiny)
    filter_point_cloud: 0        # visibility filter of the fused cloud (0: off)
    crop_to_roi: false           # OpenMVS's estimated ROI (densify and mesh) cuts the upper walls (30% of the points on tiny)
    keep_dmaps: false            # depth maps (~11.6 MB per image at level 1) are removed after fusion
    bin_dir: null                # null: OpenMVS from PATH (pixi adds .local/openmvs/bin/OpenMVS)
  mesh:                          # ReconstructMesh
    remove_spurious: 20          # remove faces with too long edges / isolated components (0: off)
    remove_spikes: true
    close_holes: 30              # close holes up to this many edges (0: off)
    smooth: 2                    # smoothing iterations
    decimate: 1.0                # 1: no decimation
  refine:                        # RefineMesh -> mesh_refined.ply (disabled or timed out: a copy of mesh_raw.ply)
    enabled: true
    use_cuda: false              # true: follows device.preference (room2: CPU 16.7 min, CUDA 20.3 min + 3.2 GB VRAM)
    resolution_level: 1
    max_face_area: 16            # faces larger than this (px, in any image pair) are subdivided
    scales: 2
    regularity_weight: 0.2       # photo-consistency vs smoothness (higher: flatter walls)
    max_minutes: 45              # killed after this; the raw mesh is kept
  preview:                       # TextureMesh at low resolution into preview/ (seam leveling off)
    enabled: true
    resolution_level: 2
    min_resolution: 320

mesh_post:                       # step 6: clean + decimate the dense mesh, texture it with OpenMVS (CUDA per device.preference)
  input: refined                 # refined | raw (05_dense/mesh_refined.ply is the raw mesh when refine was off)
  cleanup:
    min_component_frac: 0.005    # drop components with fewer faces than this fraction (room2: 17 -> 1 components)
    min_component_diam_frac: 0.02  # ... or smaller than this fraction of the bbox diagonal
  decimate:
    texture_face_budget: 600000  # quadric decimation above this many faces (room2 refined: 728k -> 600k, 3.5 s)
    planar_quadric: true
  texture:                       # TextureMesh; seam leveling always off (2.4.0 bug: 41% black texels on tiny)
    resolution_level: 0          # full-resolution keyframes (tiny: 9 s, one 4096^2 atlas; level 1: 8 s, 2048^2)
    min_resolution: 640
    max_texture_size: 8192       # larger atlases are split into several textures
    outlier_threshold: 0.06
    cost_smoothness_ratio: 0.1
    virtual_face_images: 0
    sharpness_weight: 0.5
    patch_packing_heuristic: 3

export:                          # step 7: model.glb (Y up, textures embedded) + obj/ (Z up) + metadata.json
  glb:
    double_sided: true           # room interiors are seen from inside
