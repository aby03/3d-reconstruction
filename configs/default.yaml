# Every config key with its default. Later layers (--config FILE, then --set a.b=c) override these.

run:
  output_root: outputs
  seed: 0

device:
  preference: auto               # auto (CUDA where available, else CPU) | cuda (error if unavailable) | cpu
  gpu_index: 0

loader:
  allow_mismatch: false          # truncate video frames and timestamps to the shorter instead of failing
  verify_reference_jpegs: true   # compare decoded frames with the saved JPEGs on load
  max_reference_checks: null     # null checks every reference JPEG
  decode_backend: auto           # auto | nvdec | pyav; auto uses NVDEC where available (follows device.preference)

ingest:
  camera_time_offset_ns: 0       # added to frame timestamps to get the sensor-clock query time
  max_gap_ms: {accel: 20.0, gyro: 20.0, magnetic: 50.0}
  required: [accel, gyro]
  gravity_method: complementary  # complementary | lowpass
  gravity_bidirectional: true

keyframes:
  method: adaptive               # adaptive (overlap/rotation triggers) | uniform (one per 1/uniform_fps s, baseline)
  uniform_fps: 3.0
  analysis_long_side: 960        # quality metrics on frames scaled to this long side
  metrics_backend: auto          # auto | torch | numpy; auto uses torch on CUDA where available (follows device.preference)
  metrics_batch: 32              # frames per GPU batch
  reject:                        # hard rejects; a rejected frame is only chosen when its whole window is rejected
    sharp_rel_min: 0.55          # sharpness / its 2 s rolling median
    clipped_max: 0.25            # fraction of pixels < 5 or > 250
    feat_coverage_min: 0.15      # fraction of 8x8 grid cells with >= 5 FAST corners
    omega_max: 1.5               # rad/s
  weights:                       # q = sharp*z(log sharp_rel) + features*feat_coverage - omega*omega_norm - clipped*max(0, clipped - 0.05)
    sharp: 1.0
    features: 0.5
    omega: 0.7
    clipped: 1.0
  min_per_s: 2.5                 # adaptive: trigger thresholds are scaled until the keyframe count is
  max_per_s: 7.0                 #   within [min_per_s, max_per_s] x duration
  trigger:                       # adaptive: a new keyframe is due when any of these is reached since the last one
    flow_frac: 0.04              # median KLT displacement, in image diagonals
    track_ratio: 0.70            # fraction of the keyframe's corners still tracked (at or below)
    rot_deg: 8.0                 # gyro rotation
  window_s: 0.25                 # candidates from [t_trigger - window_s, t_trigger + window_s / 2]
  min_track_ratio: 0.50          # a candidate still tracks this fraction of the keyframe's corners
  min_flow_frac: 0.01            # and has moved at least this much (no near-duplicates)
  max_gap_s: 1.0                 # longer without a trigger forces a keyframe
  jpeg_quality: 95
  prior_window: 3                # relative-rotation priors between keyframes up to this many apart
  stills: true                   # the capture's full-quality reference JPEGs (~1 Hz) join the keyframes as a second camera (cam1)

sfm:
  initial_camera_model: SIMPLE_RADIAL  # COLMAP model the mapper estimates; one camera per sequence image folder
  features:
    type: sift
    max_num_features: 8192
    max_image_size: 1920         # long side the images are scaled to for extraction
    domain_size_pooling: false   # true is better on low texture but forces COLMAP's CPU SIFT
  matching:
    strategy: auto               # auto (exhaustive up to exhaustive_max_images, else time) | time (neighbours by capture time across all cameras) | sequential (name order) | exhaustive
    exhaustive_max_images: 200
    overlap: 20                  # time / sequential: each image is matched with the next `overlap` ones (by capture time / name)
    quadratic_overlap: true      # sequential: and with the ones 2^k further on
    min_num_inliers: 15          # a pair is verified with at least this many inlier matches
    max_num_matches: 32768
    loop_detection: true         # sequential: match every loop_detection_period-th keyframe with its
    loop_detection_period: 10    #   loop_detection_num_images most similar ones (vocab tree), to close revisits
    loop_detection_num_images: 50
    vocab_tree_path: null        # null: COLMAP's SIFT tree, downloaded once into ~/.cache/colmap/ (off if that fails)
  priors:
    use_gravity_prior: true      # keyframe gravity (priors/gravity_cam.csv) constrains rotation averaging
    gravity_min_conf: 0.3        # priors below this confidence are left out
    imu_pair_filter:             # drop verified pairs whose relative rotation disagrees with the IMU
      enabled: true
      max_rot_err_deg: 10.0      # pairs up to max_dt_s apart: angle between image and gyro rotation
      max_dt_s: 5.0
      tilt_err_deg: 5.0          # other pairs: angle between the rotated gravity of one image and the other's
      max_removed_frac: 0.3      # more of the reliable (short time gap) gyro pairs disagreeing than this: the IMU is suspect, remove nothing (warning)
      reliable_dt_s: 0.5         # gyro pairs up to this far apart judge the IMU
      drift_k: 6.0               # farther pairs: wrong above the median error of their time-gap bin by this many scaled MADs (and above max_rot_err_deg)
  mapper:
    backend: global              # global (COLMAP's GLOMAP) | incremental
    fallback: true               # when fewer than min_registered_ratio of the keyframes register or the mapper
    retry_on_jumps: true         # global mapping that leaves jumps in the camera path (see sfm.continuity): map incrementally too, keep it when it has fewer jumps
    min_registered_ratio: 0.8    #   fails: retry global without gravity, then incremental; the best result is kept
  refine:                        # sparse/refined: retriangulate, upgrade the camera, BA, filter, BA
    enabled: true                # false: sparse/refined is a copy of sparse/raw
    final_camera_model: OPENCV
    refine_principal_point: false
    max_reproj_px: 2.0           # observations with a larger reprojection error are removed
    min_track_len: 3             # points seen in fewer keyframes are removed
    min_tri_angle_deg: 1.5       # points with a smaller triangulation angle are removed
    min_image_obs: 15            # images observing fewer points are deregistered first (their pose is unconstrained)
  continuity:                    # report-only: cameras close in time must be close in position and rotation (robust statistics of the capture itself)
    enabled: true
    k: 4.0                       # outlier: this many scaled MADs above the median ...
    min_step_factor: 2.0         # ... and a step / offset longer than this many median steps
    max_still_dt_s: 1.0          # a still is compared with the path camera nearest in time when within this
    rotation_floor_deg: 3.0      # gyro-vs-SfM rotation step must also exceed this
    gyro_max_dt_s: 1.0           # rotation steps are checked against the gyro up to this time gap
    gap_factor: 5.0              # a step longer than this many times the 95th-percentile step is a jump on its own
  motion:                        # accelerometer integrated inside short windows of keyframes (start velocity, bias and scale fitted per window)
    enabled: true
    window: 8
    stride: 4
    max_step_s: 1.5              # a window never spans a longer gap between keyframes
    min_motion: 3.0              # skipped when the window path is shorter than this many median steps
    max_condition: 100000.0
    k: 4.0
    min_step_factor: 1.0
  heading:                       # magnetometer against the camera orientations (report only)
    enabled: true
    k: 4.0
    floor_frac: 0.15
  repair:                        # re-register cameras that several continuity checks flag; kept only when the model gets better
    enabled: true
    min_signals: 2               # independent checks that flag a camera
    min_inliers: 30              # correspondences the new pose must explain
    inlier_px: 4.0
    gain: 1.2                    # the new pose needs this many times the inliers of the old one

align:                           # world frame W: Z up, gravity -Z, floor z = 0, origin under the median camera
  gravity:
    method: auto                 # auto (imu when enough priors, else camera_up) | imu | camera_up (image-down + floor)
    huber_deg: 3.0               # IRLS Huber threshold on the angle to the mean down direction
    min_conf: 0.3                # gravity priors below this confidence are left out
    min_prior_frac: 0.2          # auto: imu needs priors on at least this fraction of the registered images
    max_residual_deg: 5.0        # warn above this median residual (R_cam_imu, time offset or model suspect)
  floor:
    enabled: true
    min_inlier_frac: 0.05        # the floor peak holds at least this fraction of the points
    max_normal_deg: 10.0         # floor plane normal within this of up
    cameras_above_frac: 0.9      # the floor lies below at least this fraction of the cameras
    max_tilt_correction_deg: 2.0 # rotate the floor normal onto up when it is within this of gravity
    fallback_max_deg: 15.0       # camera_up: the floor normal may be this far from the image-down estimate
    bin_frac: 0.01               # histogram bin, as a fraction of the scene extent (units are arbitrary)
    ransac_iterations: 1000
    max_reproj_px: 1.5           # floor candidates: points with a smaller error
    min_track_len: 3             #   and a longer track
  manhattan:                     # yaw about Z so that X/Y follow the dominant walls
    enabled: true
    min_confidence: 0.25         # mass of the peak bin +- peak_halfwidth_deg bins; below: yaw not applied
    knn: 30                      # neighbours for the point normals
    min_planarity: 5.0           # second / smallest eigenvalue of the neighbourhood
    max_normal_z: 0.2            # wall-like normals are this close to horizontal
    peak_halfwidth_deg: 2        # in 1° bins (the confidence window is 5° wide)
    extent_tie: 1.1              # 90° ambiguity: X along the longer side, unless the sides are this close
  cam_imu:                       # hand-eye R_cam_imu and camera time offset from SfM vs gyro; report only
    enabled: true
    pair_span: 5                 # keyframe pairs up to this many apart
    min_rotation_deg: 2.0        # hand-eye uses pairs that rotate at least this much
    max_offset_ms: 100.0         # time offsets searched in +-this, 1 ms steps

dense:                           # step 5: undistort the aligned model, OpenMVS densify + mesh (CUDA per device.preference)
  undistort:
    max_image_size: -1           # -1: full resolution (1080x1920 keyframes -> 1043x1857 PINHOLE)
  openmvs:
    resolution_level: 0          # images scaled down by 2^level before patch match ... (level 0: full-resolution views, 3x the time of level 1)
    min_resolution: 640          #   ... but the long side never below this (level 2 = level 1 on 1857 px images)
    max_resolution: 2560
    number_views: 8              # neighbour views per depth map (tiny: 6 -> 70 s, 8 + iters 4 -> 101 s)
    number_views_fuse: 3         # a fused point needs this many agreeing depth maps
    fusion_filter: 1             # depth-map fusion filter (OpenMVS default 2 keeps ~4.7x fewer points on room2)
    sub_resolution_levels: 2
    iters: 3                     # patch-match iterations
    geometric_iters: 2           # geometric-consistency iterations (1: -19% time, -5% points on tiny)
    filter_point_cloud: 0        # visibility filter of the fused cloud (0: off)
    crop_to_roi: false           # OpenMVS's estimated ROI (densify and mesh) cuts the upper walls (30% of the points on tiny)
    keep_dmaps: false            # depth maps (~11.6 MB per image at level 1) are removed after fusion
    bin_dir: null                # null: OpenMVS from PATH (pixi adds .local/openmvs/bin/OpenMVS)
  filter:                        # outlier removal on the dense cloud before ReconstructMesh (the mesh is cropped to the box before RefineMesh)
    enabled: true
    roi:                         # drop points outside the dense span of each axis (same box as mesh_post.roi); off: keep the whole scene
      enabled: false
      bin_frac: 0.005
      min_density_frac: 0.15
      margin_frac: 0.01
    stat_neighbors: 30           # statistical filter: neighbours per point ...
    stat_std_ratio: 3.0          # ... and the std-devs above the mean neighbour distance that remove a point
    radius_frac: 0.01            # radius filter: radius as a fraction of the diagonal ...
    radius_min_neighbors: 8      # ... and the neighbours a point needs inside it
  mono:                          # Depth Anything V2 small (ONNX, Apache-2.0) depth per keyframe, scale/shift fitted to the SfM points of each view
    enabled: true
    input_long_side: 700         # network input long side (rounded to a multiple of 14); 1857 px keyframes -> 392 x 700 (924: 2x slower, same fit)
    cache_dir: null              # model download folder; null: ~/.cache/recon
    min_points: 30               # a view with fewer SfM points is skipped
    ransac_iters: 200
    inlier_rel: 0.1              # SfM point inlier: relative depth error below this
    min_inliers: 20
    min_inlier_ratio: 0.5
    max_median_residual: 0.05    # warn above this median relative residual in a view
    edge_rel: 0.05               # depth jumps above this fraction of the depth have no confidence
    mesh_fit: true               # refit scale/shift to the OpenMVS mesh depth (ray cast into the view); the SfM fit stays when the mesh covers too little or disagrees with the SfM points
    mesh_min_frac: 0.05          # the mesh must cover this share of the view's pixels
    mesh_trim: 0.7               # share of covered pixels (closest to the fit) used in each refit step
    mesh_max_rel: 0.3            # pixels whose fitted and mesh inverse depth differ by more than this fraction are outliers
    local_correction: true       # smooth per-view correction of the inverse depth towards the mesh, so patches meet the mesh without a step
    local_cell_px: 32            # correction grid cell, pixels of the network output
    local_clip: 0.25             # the correction changes the inverse depth by at most this fraction
    local_prior_pixels: 20.0     # a cell needs about this many mesh pixels for its full correction
  fusion:                        # TSDF of the fitted mono depth (Open3D, CPU) -> mesh_tsdf.ply, the gap filler merged in mesh_post
    enabled: true
    tau: null                    # geometry tolerance; null = as mesh_post (0.005 * diag in arbitrary units, 0.02 in metres)
    voxel_tau: 0.8               # voxel size in tau (~diagonal / 256)
    trunc_tau: 4.8               # truncation distance in tau (6 voxels)
    max_depth_frac: 0.7          # depths beyond this fraction of the diagonal are not integrated
    min_inlier_ratio: 0.7        # only views whose SfM fit is at least this good are fused ...
    max_residual: 0.05           # ... and whose median relative residual is at most this
    min_weight: 2.0              # a surface voxel needs this many views
    point_stride: 4              # every n-th pixel of each view goes into mono_points.ply
  mesh:                          # ReconstructMesh
    remove_spurious: 20          # remove faces with too long edges / isolated components (0: off)
    remove_spikes: true
    close_holes: 30              # close holes up to this many edges (0: off)
    smooth: 2                    # smoothing iterations
    decimate: 1.0                # 1: no decimation
  refine:                        # RefineMesh -> mesh_refined.ply (disabled or timed out: a copy of mesh_raw.ply)
    enabled: true
    use_cuda: false              # true: follows device.preference (room2: CPU 16.7 min, CUDA 20.3 min + 3.2 GB VRAM)
    resolution_level: 0          # refine against full-resolution views
    decimate: 1.0                # 1: RefineMesh keeps every face (unset it auto-decimates and loses detail)
    max_face_area: 16            # faces larger than this (px, in any image pair) are subdivided
    scales: 2
    regularity_weight: 0.2       # photo-consistency vs smoothness (higher: flatter walls)
    max_minutes: 240             # killed after this; the raw mesh is kept
  preview:                       # TextureMesh at low resolution into preview/ (seam leveling off)
    enabled: true
    resolution_level: 2
    min_resolution: 320

mesh_post:                       # step 6: clean, fill small holes, flatten planes, decimate the dense mesh, texture it with OpenMVS (CUDA per device.preference)
  input: refined                 # refined | raw (05_dense/mesh_refined.ply is the raw mesh when refine was off)
  roi:                           # crop to the span where the dense points are dense (tuned on one capture, cut hotel1 badly); off: keep the whole scene
    enabled: false
    bin_frac: 0.005
    min_density_frac: 0.15
    margin_frac: 0.01
  merge:                         # move unsupported OpenMVS surface onto the TSDF (mono depth) surface near it, before cleanup
    enabled: true
    unsupported_tau: 2.0         # a face farther than this many tau from every dense point is unsupported
    reach_tau: 2.0               # long edges are split to this many tau; unsupported faces adopt the TSDF within this reach
    min_coverage: 0.5            # a region of unsupported faces moves when this share of its area has the TSDF within reach
  cleanup:
    min_component_frac: 0.005    # drop components with fewer faces than this fraction (room2: 17 -> 1 components)
    min_component_diam_frac: 0.02  # ... or smaller than this fraction of the bbox diagonal
    below_floor_frac: 0.015      # drop faces this fraction of the room height below the floor (mirror images in glossy floors); 0: keep
  fill:                          # add the TSDF (mono depth) patches that lie in gaps of the OpenMVS mesh (textureless walls, ceiling, floor), after cleanup
    enabled: true
    normal_test: false           # true: gap = no mesh surface within distance_voxels along the TSDF face normal (room2: 137% area added, 52 components); false: centroid farther than gap_tau from the mesh
    distance_voxels: 1.5         # reach of the normal test, in TSDF voxels
    gap_tau: 3.0                 # (normal_test false) a TSDF face is in a gap when its centroid is farther than this many tau from the mesh
    min_area_frac: 0.005         # a connected patch is added when its area is at least this share of the mesh area
    overlap_tau: 2.0             # patches grow by this many tau beyond gap_tau, so they overlap the mesh
    weld: false                  # drop the mesh faces under a patch's overlap and join the mesh to the patch along the cut
    weld_tau: 1.0                # border vertices of mesh and patch closer than this many tau are merged
  holes:                         # close boundary loops up to a size (the outer boundary stays open)
    small_hole_max_edges: 1000   # hotel1: 100 left 113 holes open, 1000 leaves 1
    max_loop_perimeter_frac: 0.3 # loops longer than this fraction of the bbox perimeter are the outer boundary
  consistency:                   # remove unsupported faces that keyframes see through (mesh depth vs fitted mono depth, Open3D ray casting), after hole filling
    enabled: true
    pixel_stride: 2              # every n-th pixel of each mono depth map is a ray
    free_rel: 0.1                # the mesh counts as in free space where nearer than the view depth by this fraction of it ...
    free_tau: 2.0                # ... and by at least this many tau
    min_face_frac: 0.5           # a view sees a face as free space when this share of its pixels in that view is
    min_views: 3                 # removed when at least this many views see it as free space
    unsupported_tau: 2.0         # only faces farther than this many tau from every dense point can be removed
    fused_tau: 2.0               # keep faces within this many tau of the fused mono-depth surface (mesh_tsdf.ply), which single views outvote by noise; 0: off
    min_inlier_ratio: 0.7        # only views whose mono depth fits the SfM points this well count ...
    max_residual: 0.05           # ... with a median relative residual of at most this
  planes:                        # snap walls/floor/ceiling flat, straighten their edges (room2: 19 planes, 35% of the area)
    enabled: true
    snap_dist: null              # tau; null = 0.005 * diag (arbitrary units) or 0.02 (metres)
    normal_tol_deg: 20
    merge_angle_deg: 3
    manhattan_snap_deg: 5        # wall directions this close to an axis are snapped onto it
    min_plane_area_frac: 0.005
    straighten_edges: true
    max_snap_move_factor: 1.5
    smooth_nonplanar: true       # Taubin, 5 steps, vertices off the planes only
    fill_patch_weight: 0.5       # gap-fill patches (mono depth) count this much in plane detection, so they cannot tilt a plane
    bend_removal: false          # move the vertices of a bent wall onto its plane; off until scored against the dense points
    wave_cell_frac: 0.008        # bend grid cell, fraction of the diagonal
    relief_tol_frac: 0.0015      # a vertex this far from the smoothed bend is relief (a frame, a shelf) and stays
    relief_min_frac: 0.005       # relief pieces smaller than this are noise
    bend_max_tau: 6.0            # no vertex moves further than this many tau
  plane_fill:                    # flat patches over enclosed holes of walls/floor/ceiling unless the keyframes see through them; off until scored
    enabled: false
    cell_frac: 0.004             # raster cell, fraction of the diagonal
    min_plane_area_frac: 0.02
    max_hole_frac: 0.15          # larger holes are openings
    close_cells: 1
    see_through_tau: 3.0         # a view sees through a cell when its depth exceeds the plane's by this many tau ...
    in_front_tau: 3.0            # ... and a surface in front of it when smaller by this many tau
    min_votes: 2
    max_rejected_frac: 0.3
  decimate:
    texture_face_budget: 2000000 # quadric decimation above this many faces (600k before: coarse on 1080p stills)
    planar_quadric: true
  texture:                       # TextureMesh (OpenMVS develop: seam leveling fixed upstream; 2.4.0 gave 41% black texels on tiny)
    resolution_level: 0          # full-resolution keyframes (tiny: 9 s, one 4096^2 atlas; level 1: 8 s, 2048^2)
    min_resolution: 640
    max_texture_size: 8192       # larger atlases are split into several textures
    outlier_threshold: 0.06
    cost_smoothness_ratio: 0.1
    virtual_face_images: 0
    sharpness_weight: 0.5
    seam_leveling: true
  texture_fix:                   # textured_fixed/: untextured faces coloured from the dense points, gutters, opaque MTL
    fill_untextured: true
    gutter_px: 8
    jpeg_quality: 95             # PNG would be 4.3x the bytes (tiny 6.9 vs 1.6 MB)
    fill_k: 8                    # dense points averaged per face
    color_step: 8                # untextured faces whose colours round to the same multiple of this share one colour cell

export:                          # step 7: model.glb (Y up, textures embedded) + model_preview.glb + obj/ (Z up) + metadata.json
  preview_faces: 300000          # model_preview.glb: textured mesh decimated to this many faces (0: none)
  glb:
    double_sided: true           # room interiors are seen from inside

report:                          # step 8: 08_report/summary.json + index.html + figures/; a failed threshold is a warning
  figures:                       # figures/{overview,stages,path,details}.png (and panels/): renders of the outputs, the camera path with numbered waypoints
    enabled: true
    width: 1400                  # size of a rendered view in pixels
    height: 800
    azimuth: 35.0                # camera direction around the vertical axis and above the horizon, degrees
    elevation: 50.0
    zoom: 1.25
    clip_frac: 0.04              # views from above cut the model this fraction of the room height below the ceiling plane
    max_points: 1500000          # dense points drawn
    waypoints: 12                # numbered time steps on the camera path figure
    timeout_s: 1200.0            # the rendering process is stopped after this long
  thresholds:                    # stage -> metric -> bound (minimum for frames_valid_ratio, ref_jpeg_min_psnr_db,
    ingest:                      # registered_ratio; maximum for the other numbers; equal for true/false)
      frames_valid_ratio: 0.99
      ref_jpeg_min_psnr_db: 25.0
    keyframes:
      max_gap_s: 1.0
    sfm:
      registered_ratio: 0.95
      mean_reproj_px: 1.0
    align:
      gravity_residual_median_deg: 3.0
    mesh_post:
      untextured_face_frac: 0.01   # after the texture fix
      wall_rms_max_frac: 0.002     # flattest wall check (walls >= 1% of the area), x diag
      qa_p95_tau: 2.0              # dense -> mesh p95 distance in tau
    export:
      all_valid: true
