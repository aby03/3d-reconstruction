[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recon"
version = "0.1.0"
description = "3D room reconstruction from phone video and IMU data"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:dash"
