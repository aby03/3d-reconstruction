[workspace]
channels = ["conda-forge"]
name = "3d-reconstruction"
platforms = [{ name = "my-linux-64", platform = "linux-64", cuda = "13.2" }]
version = "0.1.0"

[dependencies]
python = "3.12.*"
huggingface_hub = ">=2.2.0,<3"
numpy = ">=2.4.6,<3"
scipy = ">=1.18,<2"
pytorch = { version = "==2.9.1", build = "*cuda129*" }
pycolmap = { version = "==4.2.0", build = "*cuda*129*" }
onnxruntime = { version = "==1.28.0", build = "*cuda129*" }
onnxruntime-cpp = { version = "==1.28.0", build = "*cuda129*" }
cuda-version = ">=12.9,<13"
matplotlib = ">=3.11.2,<4"
opencv = ">=5.0.0,<6"
open3d = ">=0.20.0,<0.21"
pandas = ">=3.0.1,<4"
pyyaml = ">=6.0.3,<7"
pydantic = ">=2.14,<3"
tqdm = ">=4.70,<5"
trimesh = ">=5,<6"
pytest = ">=9,<10"
av = ">=18,<19"
pymeshlab = ">=2025.7,<2026"
libopengl = "*"

[pypi-dependencies]
recon = { path = ".", editable = true }

[tasks]
download-data = "python src/download_data.py"
dev = "python src/dev.py"
test = "pytest"
make-smoke-clip = "python scripts/make_test_clip.py --input data/hotel1 --out tests/resources/hotel1_micro --start 24.6 --duration 2.5 --long-side 640 --force"
recon = "python -m recon.pipeline.cli"
1a_projection = "python src/tutorials/1_multi_view_geometry/a_projection.py"
1b_epipolar = "python src/tutorials/1_multi_view_geometry/b_epipolar.py"
1c_two_view_geometry = "python src/tutorials/1_multi_view_geometry/c_two_view_geometry.py"
3a_reconstruction = "python src/tutorials/3_reconstruction/3a_run.py"
3b_reconstruction = "python src/tutorials/3_reconstruction/3b_run.py"

[activation.env]
PYTHONPATH = "${PIXI_WORKSPACE_ROOT}"
SIMPLERECON_DIR = "${PIXI_WORKSPACE_ROOT}/.local/simplerecon"
PATH = "${PIXI_WORKSPACE_ROOT}/.local/openmvs/bin/OpenMVS:${PATH}"

# --- OpenMVS (CUDA) build: `pixi run -e build openmvs` -----------------------
# Sources: third_party/openMVS and third_party/vcglib (both git submodules; VCG
# is not on conda-forge). Installs to .local/openmvs.
[feature.build.dependencies]
cmake = "*"
ninja = "*"
pkg-config = "*"
cxx-compiler = "*"
gxx_linux-64 = "14.*"             # nvcc 12.9 supports GCC <= 14
cuda-version = "12.9.*"
cuda-nvcc = "12.9.*"
cuda-cudart-dev = "12.9.*"
cuda-driver-dev = "12.9.*"
libcublas-dev = "12.9.*"
libcurand-dev = "10.3.*"             # cuRAND ships with CUDA 12.9 as 10.3.x
libopencv = "4.*"                 # OpenMVS targets OpenCV 4; default env has 5
eigen = "*"
libboost-devel = "1.88.*"           # >=1.89 dropped the boost_system stub OpenMVS requires
cgal-cpp = "*"
nanoflann = "*"
zlib = "*"
libpng = "*"
libjpeg-turbo = "*"
libtiff = "*"
nlohmann_json = "*"
tinygltf = "*"
tinyxml2 = "*"
fast_float = "*"
ceres-solver = "*"

[feature.build.activation.env]
VCG_ROOT = "${PIXI_WORKSPACE_ROOT}/third_party/vcglib"
PATH = "${PIXI_WORKSPACE_ROOT}/.local/openmvs/bin/OpenMVS:${PATH}"

[feature.build.tasks]
mvs-deps = """test -d build/tinyply-src || git clone --depth 1 --branch 3.0 https://github.com/ddiakopoulos/tinyply.git build/tinyply-src; \
  cmake -S build/tinyply-src -B build/tinyply -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
  -DSHARED_LIB=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX=$PIXI_WORKSPACE_ROOT/.local/openmvs && cmake --build build/tinyply && cmake --install build/tinyply; \
  mkdir -p .local/openmvs/include && test -f .local/openmvs/include/BS_thread_pool.hpp || curl -fsSL -o .local/openmvs/include/BS_thread_pool.hpp https://raw.githubusercontent.com/bshoshany/thread-pool/v5.0.0/include/BS_thread_pool.hpp"""
halfmesh = """test -d build/halfmesh-src || git clone --depth 1 --branch v0.5.1 https://github.com/cdcseacave/halfmesh.git build/halfmesh-src; \
  cmake -S build/halfmesh-src -B build/halfmesh -G Ninja -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_INSTALL_PREFIX=$PIXI_WORKSPACE_ROOT/.local/openmvs -DCMAKE_PREFIX_PATH="$CONDA_PREFIX;$PIXI_WORKSPACE_ROOT/.local/openmvs" -DCMAKE_INCLUDE_PATH=$PIXI_WORKSPACE_ROOT/.local/openmvs/include \
  -DHALFMESH_BUILD_TESTS=OFF -DHALFMESH_BUILD_TOOLS=OFF -DHALFMESH_BUILD_PYTHON=OFF -DHALFMESH_BUILD_PERF=OFF \
  -DHALFMESH_BUILD_CROSSCHECKS=OFF -DHALFMESH_BUILD_BENCH=OFF && cmake --build build/halfmesh --parallel && cmake --install build/halfmesh"""
openmvs-patch = "git -C third_party/openMVS apply --check ../../patches/openmvs-no-sfm.patch && git -C third_party/openMVS apply ../../patches/openmvs-no-sfm.patch || echo patch already applied"
openmvs-configure = """cmake -S third_party/openMVS -B build/openmvs -G Ninja \
  -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_INSTALL_PREFIX=$PIXI_WORKSPACE_ROOT/.local/openmvs \
  -DCMAKE_INSTALL_RPATH=$CONDA_PREFIX/lib \
  -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
  -DCMAKE_PREFIX_PATH="$CONDA_PREFIX;$PIXI_WORKSPACE_ROOT/.local/openmvs" \
  -DOpenMVS_USE_CUDA=ON \
  -DCMAKE_CUDA_ARCHITECTURES=75 \
  -DCMAKE_CUDA_COMPILER=$CONDA_PREFIX/bin/nvcc \
  -DCMAKE_CUDA_HOST_COMPILER=$CXX \
  -DCUDAToolkit_ROOT=$CONDA_PREFIX \
  -DOpenMVS_BUILD_VIEWER=OFF \
  -DOpenMVS_USE_PYTHON=OFF \
  -DOpenMVS_USE_BREAKPAD=OFF \
  -DOpenMVS_ENABLE_TESTS=OFF"""
openmvs-build = "cmake --build build/openmvs --parallel"
openmvs-install = "cmake --install build/openmvs"
openmvs = { depends-on = ["mvs-deps", "halfmesh", "openmvs-patch", "openmvs-configure", "openmvs-build", "openmvs-install"] }

[feature.simplerecon.tasks]
fetch-simplerecon = "python -m recon.dense.simplerecon fetch"

[feature.simplerecon.dependencies]
kornia = "*"
einops = "*"

[feature.simplerecon.pypi-dependencies]
timm = "*"
pytorch-lightning = "*"
torchvision = "*"
antialiased-cnns = "*"

[feature.lightglue.pypi-dependencies]
lightglue = { git = "https://github.com/cvg/LightGlue.git", rev = "5a650c444718caffc2669dc0094cde908f42dd73" }  # DISK / SuperPoint + LightGlue for sfm.features.type

[environments]
build = { features = ["build"], no-default-feature = true }
simplerecon = { features = ["simplerecon"] }
lightglue = { features = ["lightglue"] }
