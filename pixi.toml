[workspace]
channels = ["conda-forge"]
name = "3d-reconstruction"
platforms = [{ name = "my-linux-64", platform = "linux-64", cuda = "13.2" }]
version = "0.1.0"

[dependencies]
python = "3.12.*"
huggingface_hub = ">=2.2.0,<3"
numpy = ">=2.4.6,<3"
pytorch = { version = "==2.9.1", build = "*cuda129*" }
pycolmap = { version = "==4.2.0", build = "*cuda*129*" }
onnxruntime-cpp = "==1.28.0"
cuda-version = ">=12.9,<13"
matplotlib = ">=3.11.2,<4"
opencv = ">=5.0.0,<6"
trimesh = ">=5,<6"

[tasks]
download-data = "python src/download_data.py"
dev = "python src/dev.py"
1a_projection = "python src/tutorials/1_multi_view_geometry/a_projection.py"
1b_epipolar = "python src/tutorials/1_multi_view_geometry/b_epipolar.py"
1c_two_view_geometry = "python src/tutorials/1_multi_view_geometry/c_two_view_geometry.py"
3_reconstruction = "python src/tutorials/3_reconstruction/run.py"

[activation.env]
PYTHONPATH = "${PIXI_WORKSPACE_ROOT}"
